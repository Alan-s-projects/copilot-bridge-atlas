name: Atlas Release

on:
  pull_request:
    branches: [atlas]
  push:
    tags:
      - "atlas-*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release_tag
        if: startsWith(github.ref, 'refs/tags/atlas-')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^atlas-\d+\.\d+\.\d+$') {
            throw "Release tag must be atlas-<major>.<minor>.<patch>: $tag"
          }
          $version = $tag.Substring('atlas-'.Length)
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $packageVersion) {
            throw "Tag $tag does not match package.json version $packageVersion."
          }
          $notes = "docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are missing: $notes"
          }
          git fetch --no-tags origin atlas
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the atlas branch.' }
          git merge-base --is-ancestor HEAD FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on atlas.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test:unit --maxWorkers=4 --minWorkers=1

      - name: Check catalog validation scripts
        run: python -m unittest discover -s scripts/tests -v

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        shell: pwsh
        run: |
          $env:COPILOT_BRIDGE_ATLAS_TEST_HOME = Join-Path $env:RUNNER_TEMP ("atlas-tests-" + [guid]::NewGuid().ToString("N"))
          cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Rust tests failed ($LASTEXITCODE)." }

      - name: Build Windows MSI and SHA256
        shell: pwsh
        run: ./scripts/build-msi.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-release-windows
          path: |
            release/*-Windows-x64.msi
            release/*-Windows-x64.msi.sha256
          if-no-files-found: error
          retention-days: 7

  build_macos_intel:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Intel Mac build host
        run: |
          test "$(uname -m)" = x86_64
          xcrun --sdk macosx --show-sdk-path
          bash -n scripts/build-macos-intel.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test:unit --maxWorkers=4 --minWorkers=1

      - name: Check validation scripts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target
          env-vars: MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true

      - name: Run Rust tests with disposable data
        run: |
          export COPILOT_BRIDGE_ATLAS_TEST_HOME="$(mktemp -d "${RUNNER_TEMP}/atlas-tests.XXXXXX")"
          cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1

      - name: Build and verify Intel app, DMG, and SHA256
        run: |
          set -o pipefail
          mkdir -p .codex/validation
          pnpm build 2>&1 | tee .codex/validation/macos-build.log

      - name: Check packaged WebView startup and local proxy
        run: |
          python3 scripts/check-macos-startup.py \
            --app "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Copilot Bridge Atlas.app" \
            --report .codex/validation/macos-startup.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-macos-intel-validation
          path: .codex/validation/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-release-macos-intel
          path: |
            release/*-macOS-Intel.dmg
            release/*-macOS-Intel.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/atlas-')
    needs: [build, build_macos_intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-release-*
          merge-multiple: true
          path: release

      - name: Verify artifacts and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#atlas-}"
          windows_installer="Copilot-Bridge-Atlas-${version}-Windows-x64.msi"
          macos_installer="Copilot-Bridge-Atlas-${version}-macOS-Intel.dmg"
          for installer in "$windows_installer" "$macos_installer"; do
            test -f "release/${installer}"
            test -f "release/${installer}.sha256"
            (cd release && sha256sum --check "${installer}.sha256")
          done
          test -f "docs/releases/${version}.md"

          commit="$(git rev-parse HEAD)"
          released_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf 'Created by the Atlas Release pipeline in run #%s (%s) at %s on branch atlas, commit %s.\n\n' \
              "${GITHUB_RUN_NUMBER}" "${run_url}" "${released_at}" "${commit}"
            cat "docs/releases/${version}.md"
          } > release-notes.md

          gh release create "${tag}" \
            "release/${windows_installer}" "release/${windows_installer}.sha256" \
            "release/${macos_installer}" "release/${macos_installer}.sha256" \
            --title "Copilot Bridge Atlas ${version}" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
