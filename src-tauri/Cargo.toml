[package]
name = "copilot-bridge-atlas"
version = "5.0.0"
description = "Codex GitHub Copilot bridge with usage dashboard"
authors = ["Alan's Projects"]
license = "MIT"
repository = "https://github.com/Alan-s-projects/copilot-bridge-atlas"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "copilot_bridge_atlas_lib"
crate-type = ["rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
similar = "2.7"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.8.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "socks"] }
arboard = "3.6"
flate2 = "1"
brotli = "7"
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
axum = "0.7"
tower = "0.4"
hyper = { version = "1.0", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
rustls = "0.23"
thiserror = "2.0"
tempfile = "3"
url = "2.5"
auto-launch = "0.5"
once_cell = "1.21.3"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
indexmap = { version = "2", features = ["serde"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

# Optimize the Windows installer size.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
chrono-tz = "0.10"
serial_test = "3"
base64 = "0.22"
